<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>키즈짱 시장놀이</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&display=swap" />
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <!-- 콘솔형 게임기 프레임: 모든 UI가 이 안에 있음 -->
  <div class="device" id="device">
    <div class="brand"><span class="dot r"></span><span class="dot y"></span><span class="dot g"></span>
      <b>🏘️ 키즈짱 시장놀이</b></div>

    <!-- 인게임 HUD -->
    <div class="hud" id="hud">
      <div class="chip rank" id="rankChip">
        <svg class="ic" viewBox="0 0 24 24"><circle cx="12" cy="9" r="6" fill="#f7b731"/><circle cx="12" cy="9" r="3.4" fill="#ffe08a"/><path d="M8 13 L6 22 L12 19 L18 22 L16 13Z" fill="#eb3b5a"/></svg>
        <div class="col"><div class="v" id="rankName">평민</div><div class="bar gong"><i id="gongBar"></i></div></div>
      </div>
      <div class="chip" title="별머니">
        <svg class="ic" viewBox="0 0 24 24"><path d="M12 2 L15 9 L22 9.5 L16.5 14 L18.5 21 L12 17 L5.5 21 L7.5 14 L2 9.5 L9 9Z" fill="#ffcf33" stroke="#e0a300" stroke-width="1"/></svg>
        <div class="col"><div class="k">별머니</div><div class="v" id="money">0별</div></div>
      </div>
      <div class="chip" title="체력">
        <svg class="ic" viewBox="0 0 24 24"><path d="M12 21 C4 14 3 8 7 5 C10 3 12 6 12 6 C12 6 14 3 17 5 C21 8 20 14 12 21Z" fill="#eb3b5a"/></svg>
        <div class="col"><div class="k">체력</div><div class="v" id="hp">60/60</div></div>
      </div>
      <div class="chip" title="피로도">
        <svg class="ic" viewBox="0 0 24 24"><text x="4" y="12" font-size="9" fill="#3867d6" font-family="sans-serif">Z</text><text x="10" y="18" font-size="11" fill="#3867d6" font-family="sans-serif">z</text></svg>
        <div class="col"><div class="k">피로 <span id="fatTxt">0%</span></div><div class="bar fatigue"><i id="fatBar"></i></div></div>
      </div>
      <div class="chip" title="선행점수">
        <svg class="ic" viewBox="0 0 24 24"><rect x="4" y="10" width="16" height="10" rx="2" fill="#20bf6b"/><rect x="4" y="7" width="16" height="4" rx="1" fill="#26d67a"/><rect x="11" y="7" width="2" height="13" fill="#0e8f4c"/><path d="M12 7 C10 2 6 5 12 7 C18 5 14 2 12 7Z" fill="#ff6b8a"/></svg>
        <div class="col"><div class="k">선행</div><div class="v" id="deed">0점</div></div>
      </div>
    </div>

    <!-- 월드 화면 -->
    <div class="screen">
      <div class="scene" id="scene"></div>
      <div class="talk" id="talk">방향키·마우스로 걸어다니고, 다가가서 Space로 상호작용해요! 표지판을 따라 다른 맵으로 이동해요 🗺️</div>
      <!-- 전투 오버레이 -->
      <div class="overlay" id="battle"><div class="battlebox" id="battleBox"></div></div>
    </div>

    <!-- 액션 바 -->
    <div class="actionbar">
      <button class="abtn" id="bagBtn"><span class="e">🎒</span>가방<span class="badge" id="bagCount">0</span></button>
      <button class="abtn" id="travelBtn"><span class="e">🗺️</span>빠른이동</button>
      <button class="abtn" id="manualBtn"><span class="e">📖</span>설명서</button>
      <button class="abtn" id="gearBtn"><span class="e">⚙️</span>설정</button>
    </div>

    <!-- 팝업 (인게임) -->
    <div class="overlay" id="popup"><div class="popcard"><button class="popclose" id="popClose" aria-label="닫기">✕</button><div id="popBody"></div></div></div>

    <!-- 이벤트/계급 모달 -->
    <div class="overlay" id="ov"><div class="modal"><div class="em" id="ovEm">🎉</div><h2 id="ovTitle"></h2><p id="ovText"></p><button class="btn work" id="ovBtn">좋았어! ▶</button></div></div>

    <!-- 토스트 -->
    <div class="toast" id="toast"></div>

    <div class="kbdhint" id="kbdhint">🕹️ <b>방향키·WASD·마우스</b>로 걷기 · 다가가 <b>Space</b> 상호작용 · <b>숫자키</b> 빠른이동 · <b>?</b> 설명서</div>
  </div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
