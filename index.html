<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>키즈짱 시장놀이</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="frame" id="frame">
    <h1>🏘️ 키즈짱 시장놀이</h1>
    <div class="sub">자원을 모아 팔고 · 계급을 올리고 · 선행을 쌓아요</div>

    <div class="hud">
      <div class="stat">
        <div class="top"><span id="rankName">평민</span><span>내공</span></div>
        <div class="big">🏅 <span id="rankNext">다음:견습</span></div>
        <div class="bar gong"><i id="gongBar"></i></div>
      </div>
      <div class="stat">
        <div class="top"><span>피로도</span><span id="fatTxt">0%</span></div>
        <div class="big">😴</div>
        <div class="bar fatigue"><i id="fatBar"></i></div>
      </div>
      <div class="stat">
        <div class="top"><span>별머니</span><span>⭐</span></div>
        <div class="big" id="money">0별</div>
      </div>
      <div class="stat">
        <div class="top"><span>선행점수</span><span>❤️</span></div>
        <div class="big" id="deed">0점</div>
      </div>
    </div>

    <div class="scene" id="scene"></div>
    <div class="talk" id="talk">환영해요! 숲·바다·광산·들판에서 자원을 모아 상점에 팔아봐요! 🌟</div>

    <div class="panel" id="dynPanel"></div>

    <div class="panel">
      <h3>🎒 내 가방 <span class="muted" id="invCount">0칸</span></h3>
      <div class="inv" id="inv"><span class="muted">아직 비어있어요~ 자원을 모아보세요!</span></div>
    </div>

    <div class="nav" id="nav"></div>

    <div class="kbdhint" id="kbdhint">🕹️ <b>방향키·WASD·마우스</b>로 걷기 · 다가가서 <b>Space</b> 상호작용 · <b>숫자키</b> 빠른이동 · <b>?</b> 도움말</div>

    <div class="footer">
      <button id="muteBtn">🔊 소리</button>
      <button id="bgmBtn">🎵 음악</button>
      <button id="helpBtn">⌨️ 도움말</button>
      <button id="resetBtn">🔄 처음부터</button>
    </div>

    <div class="toast" id="toast"></div>
    <div class="ov" id="ov">
      <div class="modal">
        <div class="em" id="ovEm">🎉</div>
        <h2 id="ovTitle">계급 상승!</h2>
        <p id="ovText"></p>
        <button class="btn work" id="ovBtn" style="box-shadow:0 5px 0 rgba(0,0,0,.18)">좋았어! ▶</button>
      </div>
    </div>
  </div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
