<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>키즈짱 시장놀이</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&display=swap" />
<style>
:root{
  --ink:#2e2620; --cream:#fffdf5; --panel:#fff7e6;
  --gold:#f7b731; --green:#20bf6b; --blue:#3867d6; --red:#eb3b5a;
  --brown:#a0642e; --purple:#b197fc;
  --device:#ffd98a; --device2:#ffc35e; --bezel:#5a3e28;
  --shadow:0 6px 0 rgba(0,0,0,.14);
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent; font-family:inherit;}
html,body{margin:0; height:100%;}
body{
  font-family:"Jua","Comic Sans MS",system-ui,sans-serif; color:var(--ink);
  background:radial-gradient(circle at 50% 0%, #ffe9c2, #f6b878 70%, #e79a58);
  display:flex; align-items:flex-start; justify-content:center; min-height:100%;
  padding:12px; overflow-x:hidden;
}
img{user-select:none;}

/* ===== 콘솔 기기 프레임 ===== */
.device{
  position:relative; width:100%; max-width:640px;
  background:linear-gradient(180deg,var(--device),var(--device2));
  border:5px solid var(--bezel); border-radius:26px;
  padding:12px; box-shadow:0 12px 30px rgba(90,62,40,.4), inset 0 2px 0 rgba(255,255,255,.4);
  display:flex; flex-direction:column; gap:9px;
}
.brand{display:flex; align-items:center; gap:6px; font-size:16px; color:var(--bezel); padding:0 4px;}
.brand b{margin-left:2px;}
.brand .dot{width:9px; height:9px; border-radius:50%; box-shadow:inset 0 -1px 1px rgba(0,0,0,.25);}
.brand .dot.r{background:#ff5a5a;} .brand .dot.y{background:#ffcf33;} .brand .dot.g{background:#4cd68a;}

/* ===== HUD (인게임) ===== */
.hud{display:flex; gap:6px; flex-wrap:wrap; background:rgba(90,62,40,.16); border-radius:14px; padding:7px;}
.chip{display:flex; align-items:center; gap:6px; background:var(--cream); border-radius:11px;
  padding:5px 9px; box-shadow:0 2px 0 rgba(0,0,0,.12); flex:1 1 auto; min-width:0;}
.chip .ic{width:22px; height:22px; flex:none;}
.chip .col{min-width:0;}
.chip .k{font-size:10px; color:#a58b6f; line-height:1;}
.chip .v{font-size:15px; line-height:1.15; white-space:nowrap;}
.chip.rank{flex:1 1 130px;}
.bar{height:8px; border-radius:6px; background:#e6dcc7; overflow:hidden; margin-top:3px; min-width:56px;}
.bar > i{display:block; height:100%; width:0%; border-radius:6px; transition:width .3s;}
.bar.gong > i{background:linear-gradient(90deg,#f7b731,#fa8231);}
.bar.fatigue > i{background:linear-gradient(90deg,#20bf6b,#f7b731,#eb3b5a);}

/* ===== 월드 화면 ===== */
.screen{position:relative; border-radius:16px; overflow:hidden; border:4px solid var(--bezel);
  background:#9fe08f; box-shadow:inset 0 0 0 3px rgba(255,255,255,.35);}
.scene{position:relative; display:block; line-height:0;}
.world{display:block; width:100%; height:auto; touch-action:none;}
.talk{position:absolute; left:8px; right:8px; bottom:8px; background:rgba(255,251,233,.94);
  border:2px solid #ffe08a; border-radius:12px; padding:7px 11px; font-size:14px; text-align:center;
  line-height:1.3; box-shadow:0 3px 8px rgba(0,0,0,.15);}

/* 터치 방향패드 */
.dpad{position:absolute; left:8px; bottom:52px; display:none;
  grid-template-columns:repeat(3,44px); grid-template-rows:repeat(3,44px); gap:4px; z-index:6; opacity:.92;}
.dpad .dbtn{border:none; border-radius:11px; background:rgba(46,38,32,.55); color:#fff; font-size:19px;
  cursor:pointer; touch-action:none; user-select:none;}
.dpad .dbtn.up{grid-area:1/2/2/3;} .dpad .dbtn.left{grid-area:2/1/3/2;}
.dpad .dbtn.act{grid-area:2/2/3/3; background:var(--green); font-size:22px;} .dpad .dbtn.right{grid-area:2/3/3/4;}
.dpad .dbtn.down{grid-area:3/2/4/3;}
@media (pointer:coarse){ .dpad{display:grid;} }

/* ===== 액션 바 ===== */
.actionbar{display:flex; gap:6px;}
.abtn{position:relative; flex:1; border:none; border-radius:13px; padding:9px 4px; cursor:pointer;
  background:var(--cream); color:var(--ink); font-size:13px; box-shadow:0 3px 0 rgba(0,0,0,.18);
  display:flex; flex-direction:column; align-items:center; gap:1px; line-height:1;}
.abtn .e{font-size:19px;}
.abtn:active{transform:translateY(3px); box-shadow:0 0 0 rgba(0,0,0,.18);}
.abtn .badge{position:absolute; top:3px; right:6px; background:var(--red); color:#fff;
  border-radius:9px; font-size:10px; padding:0 5px; min-width:16px;}

/* ===== 공용 오버레이 ===== */
.overlay{position:absolute; inset:0; background:rgba(46,38,32,.55); display:flex; align-items:center;
  justify-content:center; padding:16px; opacity:0; pointer-events:none; transition:.2s; z-index:30;}
.overlay.show{opacity:1; pointer-events:auto;}
#battle{position:absolute; inset:0; border-radius:12px; z-index:20;}
#battle .battlebox{width:100%;}

.popcard{position:relative; background:var(--cream); border-radius:20px; padding:16px 14px;
  max-width:420px; width:100%; max-height:88%; overflow:auto; box-shadow:0 12px 0 rgba(0,0,0,.2);
  transform:scale(.9); transition:.2s; border:3px solid #fff;}
.overlay.show .popcard{transform:scale(1);}
.popclose{position:absolute; top:8px; right:8px; border:none; background:#eee; color:#666;
  width:30px; height:30px; border-radius:50%; cursor:pointer; font-size:15px; box-shadow:0 2px 0 rgba(0,0,0,.12);}
.popclose:active{transform:translateY(2px);}
.popcard h2{margin:2px 0 10px; font-size:21px; padding-right:28px;}
.popcard h3{margin:12px 0 7px; font-size:15px; display:flex; justify-content:space-between; align-items:center;}

.modal{background:var(--cream); border-radius:22px; padding:22px 18px; text-align:center; max-width:330px;
  width:100%; box-shadow:0 10px 0 rgba(0,0,0,.2); transform:scale(.85); transition:.25s; border:3px solid #fff;}
.overlay.show .modal{transform:scale(1);}
.modal .em{font-size:52px;} .modal h2{margin:6px 0; font-size:24px;} .modal p{color:#7a6650; font-size:14px; margin:4px 0 14px; white-space:pre-line;}

/* ===== 버튼/리스트 공용(팝업 내용) ===== */
.btn{border:none; border-radius:14px; padding:11px 15px; font-size:15px; color:#fff; cursor:pointer;
  box-shadow:0 5px 0 rgba(0,0,0,.18); transition:transform .07s, box-shadow .07s;}
.btn:active{transform:translateY(4px); box-shadow:0 1px 0 rgba(0,0,0,.18);}
.btn:disabled{filter:grayscale(.6) brightness(.95); opacity:.7; cursor:not-allowed;}
.btn.work{background:var(--green);} .btn.sell{background:var(--gold);} .btn.sleep{background:var(--blue);}
.btn.give{background:var(--red);} .btn.up{background:var(--brown);}
.act{margin-top:12px; display:flex; gap:8px; flex-wrap:wrap; justify-content:center;}
.muted{color:#b3a082; font-size:13px;}
.inv{display:flex; flex-wrap:wrap; gap:6px; min-height:30px; align-items:center;}
.slot{background:#fff; border-radius:12px; padding:4px 8px; font-size:15px; box-shadow:0 2px 0 rgba(0,0,0,.08);
  display:flex; align-items:center; gap:4px;}
.slot .cnt{background:var(--brown); color:#fff; border-radius:9px; font-size:12px; padding:0 5px;}
.slot.rare{box-shadow:0 0 0 2px var(--gold), 0 2px 0 rgba(0,0,0,.1);}
.shopgrid{display:grid; grid-template-columns:1fr 1fr; gap:7px;}
.row{display:flex; justify-content:space-between; align-items:center; background:#fff; border-radius:12px;
  padding:6px 8px; font-size:14px; box-shadow:0 2px 0 rgba(0,0,0,.07); margin-bottom:6px;}
.row button{border:none; background:var(--gold); color:#fff; border-radius:10px; padding:5px 9px; font-size:13px; cursor:pointer; box-shadow:0 3px 0 rgba(0,0,0,.15);}
.row button:active{transform:translateY(2px); box-shadow:0 1px 0 rgba(0,0,0,.15);}
.tabs{display:flex; gap:4px; flex-wrap:wrap; margin-bottom:8px;}
.tab{border:none; background:#fff; color:#9b8468; border-radius:12px; padding:6px 9px; font-size:12px;
  cursor:pointer; box-shadow:0 2px 0 rgba(0,0,0,.08);}
.tab.on{background:var(--brown); color:#fff;}
.spr{display:inline-block; height:1.1em; width:auto; vertical-align:-0.18em;}

/* 전투 씬 */
.bfield{display:flex; justify-content:space-around; align-items:flex-end; padding:10px; background:linear-gradient(180deg,#3a4149,#20252b);
  border-radius:12px; color:#fff;}
.bfield .who{text-align:center;} .bfield .em{font-size:46px;}

/* 토스트 */
.toast{position:absolute; left:50%; top:52px; transform:translateX(-50%) translateY(-20px); background:var(--ink);
  color:#fff; padding:8px 14px; border-radius:20px; font-size:14px; opacity:0; transition:.3s; z-index:40;
  pointer-events:none; white-space:nowrap;}
.toast.show{opacity:1; transform:translateX(-50%) translateY(0);}

/* 획득 이펙트 */
.float{position:absolute; font-size:22px; pointer-events:none; animation:fl 1s ease-out forwards; z-index:5;}
@keyframes fl{from{transform:translate(0,0); opacity:1} to{transform:translate(var(--dx,0),-60px); opacity:0}}

/* 미니게임 트랙 */
.mgtrack{position:relative; height:26px; border-radius:13px; margin:10px 0 14px;
  background:linear-gradient(90deg,#ffd6d6,#fff3bf,#ffd6d6); overflow:hidden; border:3px solid #fff;}
.mgzone{position:absolute; left:38%; width:24%; top:0; bottom:0; background:rgba(32,191,107,.55); border-left:2px solid #20bf6b; border-right:2px solid #20bf6b;}
.mgmarker{position:absolute; top:-2px; width:8px; height:30px; background:var(--ink); border-radius:4px; transform:translateX(-50%); box-shadow:0 0 0 2px #fff;}

/* 힌트/접근성 */
.kbdhint{display:none; text-align:center; font-size:11px; color:var(--bezel); opacity:.8;}
.kbdhint b{background:rgba(255,255,255,.5); border-radius:5px; padding:0 5px;}
@media (hover:hover) and (pointer:fine){ .kbdhint{display:block;} }
button:focus-visible, .tab:focus-visible, .abtn:focus-visible{outline:3px solid var(--blue); outline-offset:2px;}
@media (prefers-reduced-motion: reduce){ *{animation-duration:.001ms !important; transition-duration:.001ms !important;} }

</style>
</head>
<body>
<!-- 콘솔형 게임기 프레임: 모든 UI가 이 안에 있음 -->
  <div class="device" id="device">
    <div class="brand"><span class="dot r"></span><span class="dot y"></span><span class="dot g"></span>
      <b>🏘️ 키즈짱 시장놀이</b></div>

    <!-- 인게임 HUD -->
    <div class="hud" id="hud">
      <div class="chip rank" id="rankChip">
        <svg class="ic" viewBox="0 0 24 24"><circle cx="12" cy="9" r="6" fill="#f7b731"/><circle cx="12" cy="9" r="3.4" fill="#ffe08a"/><path d="M8 13 L6 22 L12 19 L18 22 L16 13Z" fill="#eb3b5a"/></svg>
        <div class="col"><div class="v" id="rankName">평민</div><div class="bar gong"><i id="gongBar"></i></div></div>
      </div>
      <div class="chip" title="별머니">
        <svg class="ic" viewBox="0 0 24 24"><path d="M12 2 L15 9 L22 9.5 L16.5 14 L18.5 21 L12 17 L5.5 21 L7.5 14 L2 9.5 L9 9Z" fill="#ffcf33" stroke="#e0a300" stroke-width="1"/></svg>
        <div class="col"><div class="k">별머니</div><div class="v" id="money">0별</div></div>
      </div>
      <div class="chip" title="체력">
        <svg class="ic" viewBox="0 0 24 24"><path d="M12 21 C4 14 3 8 7 5 C10 3 12 6 12 6 C12 6 14 3 17 5 C21 8 20 14 12 21Z" fill="#eb3b5a"/></svg>
        <div class="col"><div class="k">체력</div><div class="v" id="hp">60/60</div></div>
      </div>
      <div class="chip" title="피로도">
        <svg class="ic" viewBox="0 0 24 24"><text x="4" y="12" font-size="9" fill="#3867d6" font-family="sans-serif">Z</text><text x="10" y="18" font-size="11" fill="#3867d6" font-family="sans-serif">z</text></svg>
        <div class="col"><div class="k">피로 <span id="fatTxt">0%</span></div><div class="bar fatigue"><i id="fatBar"></i></div></div>
      </div>
      <div class="chip" title="선행점수">
        <svg class="ic" viewBox="0 0 24 24"><rect x="4" y="10" width="16" height="10" rx="2" fill="#20bf6b"/><rect x="4" y="7" width="16" height="4" rx="1" fill="#26d67a"/><rect x="11" y="7" width="2" height="13" fill="#0e8f4c"/><path d="M12 7 C10 2 6 5 12 7 C18 5 14 2 12 7Z" fill="#ff6b8a"/></svg>
        <div class="col"><div class="k">선행</div><div class="v" id="deed">0점</div></div>
      </div>
    </div>

    <!-- 월드 화면 -->
    <div class="screen">
      <div class="scene" id="scene"></div>
      <div class="talk" id="talk">방향키·마우스로 걸어다니고, 다가가서 Space로 상호작용해요! 표지판을 따라 다른 맵으로 이동해요 🗺️</div>
      <!-- 전투 오버레이 -->
      <div class="overlay" id="battle"><div class="battlebox" id="battleBox"></div></div>
    </div>

    <!-- 액션 바 -->
    <div class="actionbar">
      <button class="abtn" id="bagBtn"><span class="e">🎒</span>가방<span class="badge" id="bagCount">0</span></button>
      <button class="abtn" id="travelBtn"><span class="e">🗺️</span>빠른이동</button>
      <button class="abtn" id="manualBtn"><span class="e">📖</span>설명서</button>
      <button class="abtn" id="gearBtn"><span class="e">⚙️</span>설정</button>
    </div>

    <!-- 팝업 (인게임) -->
    <div class="overlay" id="popup"><div class="popcard"><button class="popclose" id="popClose" aria-label="닫기">✕</button><div id="popBody"></div></div></div>

    <!-- 이벤트/계급 모달 -->
    <div class="overlay" id="ov"><div class="modal"><div class="em" id="ovEm">🎉</div><h2 id="ovTitle"></h2><p id="ovText"></p><button class="btn work" id="ovBtn">좋았어! ▶</button></div></div>

    <!-- 토스트 -->
    <div class="toast" id="toast"></div>

    <div class="kbdhint" id="kbdhint">🕹️ <b>방향키·WASD·마우스</b>로 걷기 · 다가가 <b>Space</b> 상호작용 · <b>숫자키</b> 빠른이동 · <b>?</b> 설명서</div>
  </div>
<script>
(function(){
"use strict";

// ===== js/core/format.js =====
// 별머니 표기: 숫자 → "1,234별" (단일 통화)
const won = (n) => Math.round(n).toLocaleString("ko-KR") + "별";


// ===== js/core/rng.js =====
// 난수 유틸
const rnd = (n) => Math.floor(Math.random() * n);

// 가중치 기반 무작위 선택. list 요소는 {w:가중치} 를 가짐
function weighted(list) {
  const total = list.reduce((s, x) => s + x.w, 0);
  let r = Math.random() * total;
  for (const x of list) {
    if ((r -= x.w) < 0) return x;
  }
  return list[0];
}

// 계급(신분) — 내공점수 누적 기준. 밸런스: 중간 곡선

// ===== js/data/places.js =====

  const pool = [...QUEST_TEMPLATES].sort(() => Math.random() - 0.5).slice(0, 3);
  const list = pool.map((t, i) => {
    const goal = rint(t.min, t.max);
    return {
      key: t.id + "_" + i, type: t.type, nm: t.nm, unit: t.unit, goal,
      progress: 0, done: false, claimed: false,
      rewardMoney: Math.round(goal * t.moneyPer * (i === 0 ? 1.5 : 1)),
    };
  });
  return { date: dateStr, list };
}

// ===== js/core/audio.js =====
// Web Audio 기반 간단 효과음. 음소거 토글 지원.
let AC = null;
let muted = false;

function setMuted(v) { muted = !!v; }
function isMuted() { return muted; }
function toggleMuted() { muted = !muted; return muted; }

function beep(freq, dur, type) {
  if (muted) return;
  try {
    AC = AC || new (window.AudioContext || window.webkitAudioContext)();
    const o = AC.createOscillator(), g = AC.createGain();
    o.type = type || "sine";
    o.frequency.value = freq;
    o.connect(g); g.connect(AC.destination);
    g.gain.setValueAtTime(0.0001, AC.currentTime);
    g.gain.exponentialRampToValueAtTime(0.22, AC.currentTime + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, AC.currentTime + dur);
    o.start(); o.stop(AC.currentTime + dur);
  } catch (e) { /* 오디오 미지원 무시 */ }
}

const sfx = {
  get:  () => beep(600, 0.09, "triangle"),
  rare: () => { beep(660, 0.1); setTimeout(() => beep(880, 0.12), 90); setTimeout(() => beep(1040, 0.16), 190); },
  sell: () => { beep(520, 0.08, "square"); setTimeout(() => beep(680, 0.09, "square"), 70); },
  sleep: () => beep(300, 0.3, "sine"),
  bad:  () => beep(150, 0.25, "sawtooth"),
  up:   () => [523, 659, 784, 1046].forEach((f, i) => setTimeout(() => beep(f, 0.16), i * 110)),
  hit:  () => beep(220, 0.08, "square"),
  hurt: () => beep(120, 0.18, "sawtooth"),
  heal: () => { beep(500, 0.1, "sine"); setTimeout(() => beep(760, 0.12, "sine"), 90); },
};

// ---------- 배경음악 (BGM) — Web Audio로 생성하는 잔잔한 루프 ----------
let bgmTimer = null;
let bgmStep = 0;
// 펜타토닉 느낌의 잔잔한 멜로디 + 낮은 베이스
const BGM_MELODY = [523, 587, 659, 784, 659, 587, 523, 440];
const BGM_BASS = [131, 131, 165, 165, 196, 196, 131, 131];

function bgmNote(freq, dur, vol, type) {
  try {
    AC = AC || new (window.AudioContext || window.webkitAudioContext)();
    const o = AC.createOscillator(), g = AC.createGain();
    o.type = type || "sine";
    o.frequency.value = freq;
    o.connect(g); g.connect(AC.destination);
    g.gain.setValueAtTime(0.0001, AC.currentTime);
    g.gain.exponentialRampToValueAtTime(vol, AC.currentTime + 0.05);
    g.gain.exponentialRampToValueAtTime(0.0001, AC.currentTime + dur);
    o.start(); o.stop(AC.currentTime + dur);
  } catch (e) { /* 무시 */ }
}

function isBgmOn() { return !!bgmTimer; }

function startBgm() {
  if (bgmTimer) return;
  bgmStep = 0;
  bgmTimer = setInterval(() => {
    const m = BGM_MELODY[bgmStep % BGM_MELODY.length];
    const b = BGM_BASS[bgmStep % BGM_BASS.length];
    bgmNote(m, 0.42, 0.06, "triangle");     // 멜로디 (작게)
    bgmNote(b, 0.5, 0.05, "sine");          // 베이스
    bgmStep++;
  }, 500);
}

function stopBgm() {
  if (bgmTimer) { clearInterval(bgmTimer); bgmTimer = null; }
}

function toggleBgm() {
  if (bgmTimer) { stopBgm(); return false; }
  startBgm(); return true;
}

    market: { date: "", mult: 1, hotItem: null },    // 상점 시세
    journalTab: "quest", // 모험수첩 탭
    // 진행
    place: "forest",     // 현재 상호작용 중인 장소/건물 컨텍스트
    mapId: "village",    // 현재 보고 있는 맵 (한 화면 = 한 맵)
    mode: "world",       // "world"(맵을 걸어다님) | "battle"(전투 화면)
    heavenOpen: false,
    foe: null,           // 전투 중 몬스터(저장하지 않음)
    flags: { tutorialDone: false },
    settings: { sound: true, bgm: false },
  };
}

// 살아있는 전역 상태 객체 (모듈들이 이 참조를 공유)
const S = defaultState();

// 상태를 obj 값으로 교체(참조는 유지)
function applyState(obj) {
  const fresh = defaultState();
  Object.keys(S).forEach((k) => delete S[k]);
  Object.assign(S, fresh, obj || {});
  // 중첩 객체 보정
  S.inv = (obj && obj.inv) || {};
  S.flags = Object.assign({}, fresh.flags, (obj && obj.flags) || {});
  S.settings = Object.assign({}, fresh.settings, (obj && obj.settings) || {});
  S.mods = Object.assign({}, fresh.mods, (obj && obj.mods) || {});
  S.furniture = (obj && obj.furniture) || [];
  S.farm = (obj && obj.farm) || [];
  S.foodBuff = (obj && obj.foodBuff) || null;
  S.stats = Object.assign({}, fresh.stats, (obj && obj.stats) || {});
  S.codex = Object.assign({ items: [], monsters: [], recipes: [] }, (obj && obj.codex) || {});
  S.quests = (obj && obj.quests) || { date: "", list: [] };
  S.market = (obj && obj.market) || { date: "", mult: 1, hotItem: null };
  S.foe = null;      // 전투 상태는 복원하지 않음
  S.mode = "world";  // 항상 월드에서 시작
}

function resetState() {
  applyState(defaultState());
}

// ---- 파생/헬퍼 ----
function playerAtk() {
  const food = (S.foodBuff && S.foodBuff.stat === "atk") ? S.foodBuff.amount : 0;
  return 6 + S.weapon * 4 + (S.mods.atkBonus || 0) + food;
}
// 채집 1회 피로 소모(가구 보너스 반영)
function gatherFatigue() { return Math.max(3, 12 - (S.mods.fatigueReduce || 0)); }
// 채집 추가 수확량(가구 + 요리 버프)
function gatherBonus() {
  const food = (S.foodBuff && S.foodBuff.stat === "gather") ? S.foodBuff.amount : 0;
  return (S.mods.gatherBonus || 0) + food;
}
function rankName() { return RANKS[S.rankIdx].n; }
function nextRank() { return RANKS[S.rankIdx + 1]; }

function addItem(it) {
  if (!S.inv[it.id]) S.inv[it.id] = { id: it.id, pic: it.pic, nm: it.nm, pr: it.pr, count: 0, rare: !!it.rare };
  S.inv[it.id].count++;
}
function invSlots() { return Object.values(S.inv).filter((x) => x.count > 0); }


// ===== js/core/save.js =====
// localStorage 자동 저장/불러오기/초기화

const KEY = "kidszzang_market_save_v1";

function save() {
  try {
    const data = JSON.parse(JSON.stringify(S));
    data.foe = null; // 전투 중 상태는 저장하지 않음
    localStorage.setItem(KEY, JSON.stringify(data));
    return true;
  } catch (e) {
    return false;
  }
}

function load() {
  try {
    const raw = localStorage.getItem(KEY);
    if (!raw) return false;
    const data = JSON.parse(raw);
    if (!data || data.version !== SAVE_VERSION) {
      // 스키마 불일치 — 추후 마이그레이션 지점. 지금은 새 게임으로.
      return false;
    }
    applyState(data);
    return true;
  } catch (e) {
    return false;
  }
}

function hardReset() {
  try { localStorage.removeItem(KEY); } catch (e) { /* noop */ }
  resetState();
}

function hasSave() {
  try { return !!localStorage.getItem(KEY); } catch (e) { return false; }
}

// 주기적 자동 저장 + 이탈 시 저장
function startAutosave(intervalMs = 3000) {
  setInterval(save, intervalMs);
  window.addEventListener("beforeunload", save);
  document.addEventListener("visibilitychange", () => { if (document.hidden) save(); });
}


// ===== js/ui/view.js =====
// UI 기본 요소: DOM 헬퍼, 말풍선, 토스트, 모달, 이펙트, 스프라이트

const $ = (id) => document.getElementById(id);

// 스프라이트: 준비된 이미지가 있으면 <img>, 없으면 이모지 텍스트
function sprite(kind, id, emoji, cls = "spr") {
  if (hasSprite(kind, id)) {
    return `<img class="${cls}" src="${spritePath(kind, id)}" alt="" draggable="false">`;
  }
  return emoji || "";
}

function say(msg) { const t = $("talk"); if (t) t.textContent = msg; }

function toast(msg) {
  const t = $("toast");
  if (!t) return;
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(t._t);
  t._t = setTimeout(() => t.classList.remove("show"), 1400);
}

function showModal(em, title, text, onClose) {
  $("ovEm").textContent = em;
  $("ovTitle").textContent = title;
  $("ovText").textContent = text;
  $("ov").classList.add("show");
  $("ov")._onClose = typeof onClose === "function" ? onClose : null;
}
function hideModal() {
  $("ov").classList.remove("show");
  const cb = $("ov")._onClose; $("ov")._onClose = null;
  if (cb) cb();
}

// 작은 요소 흔들기 애니메이션
function shake(id) {
  const el = $(id);
  if (el) { el.classList.remove("work"); void el.offsetWidth; el.classList.add("work"); }
}

// 획득 아이템이 위로 떠오르는 이펙트
function floatLoot(got) {
  const sc = $("scene");
  if (!sc) return;
  const r = sc.getBoundingClientRect();
  got.slice(0, 6).forEach((it, i) => {
    const f = document.createElement("div");
    f.className = "float";
    f.textContent = it.pic;
    f.style.left = (r.width / 2 - 10 + (i - 2) * 22) + "px";
    f.style.top = (r.height / 2) + "px";
    f.style.setProperty("--dx", ((i - 2) * 10) + "px");
    sc.appendChild(f);
    setTimeout(() => f.remove(), 1000);
  });
}


// ===== js/ui/minigame.js =====
// 타이밍 미니게임: 움직이는 막대를 가운데 목표칸에서 멈추면 성공도↑
let rafId = null;

function playTiming(label, onDone) {
  let ov = document.getElementById("mgOv");
  if (!ov) {
    ov = document.createElement("div");
    ov.id = "mgOv";
    ov.className = "ov show";
    document.getElementById("frame").appendChild(ov);
  } else {
    ov.classList.add("show");
  }
  ov.innerHTML = `
    <div class="modal">
      <div class="em">🎯</div>
      <h2>${label}!</h2>
      <p>움직이는 막대가 <b>가운데 초록 칸</b>에 올 때 잡아요!</p>
      <div class="mgtrack"><div class="mgzone"></div><div class="mgmarker" id="mgMarker"></div></div>
      <button class="btn work" id="mgHit" style="box-shadow:0 5px 0 rgba(0,0,0,.18);width:100%">잡기! 🖐️</button>
    </div>`;

  const marker = document.getElementById("mgMarker");
  let pos = 0, dir = 1;
  const speed = 0.016 + Math.random() * 0.008;

  function frame() {
    pos += dir * speed;
    if (pos >= 1) { pos = 1; dir = -1; }
    if (pos <= 0) { pos = 0; dir = 1; }
    marker.style.left = (pos * 100) + "%";
    rafId = requestAnimationFrame(frame);
  }
  rafId = requestAnimationFrame(frame);

  function finish() {
    if (rafId) { cancelAnimationFrame(rafId); rafId = null; }
    const d = Math.abs(pos - 0.5);
    let tier;
    if (d <= 0.06) tier = { mult: 2, name: "완벽", perfect: true };
    else if (d <= 0.14) tier = { mult: 1.5, name: "좋음" };
    else if (d <= 0.24) tier = { mult: 1, name: "성공" };
    else tier = { mult: 0.4, name: "아쉬움" };
    ov.classList.remove("show");
    ov.innerHTML = "";
    onDone(tier);
  }
  document.getElementById("mgHit").onclick = finish;
}

// ===== js/systems/gather.js =====
// 채집/낚시/채광/사냥 — 생산 활동 로직 (미니게임 지원)

function doWork() {
  const p = PLACES[S.place];
  if (!p || !p.loot) return;
  if (S.fatigue >= 100) {
    sfx.bad();
    say("너무 피곤해서 쓰러질 것 같아요! 🏠집에서 쉬어야 해요~");
    return;
  }
  if (p.minigame) {
    playTiming(p.verb, (tier) => doHarvest(p, tier));
  } else {
    doHarvest(p, { mult: 1, name: "" });
  }
}

function doHarvest(p, tier) {
  shake("hero");
  const mult = tier.mult != null ? tier.mult : 1;

  // 수확량: 기본 × 성공도 배수
  const base = 1 + rnd(1 + S.tool) + gatherBonus();
  const amount = Math.max(1, Math.round(base * mult));
  const rareMul = tier.perfect ? 2 : 1;

  let got = [], gongGain = 0, rareHit = false;
  for (let i = 0; i < amount; i++) {
    if (Math.random() < (0.04 + S.tool * 0.015) * rareMul) {
      addItem(p.rare); got.push(p.rare); rareHit = true; gongGain += 8;
    } else {
      const it = weighted(p.loot);
      addItem(it); got.push(it); gongGain += 2;
    }
  }
  gongGain += S.mods.gongBonus || 0;
  S.gong += gongGain;
  S.fatigue = Math.min(100, S.fatigue + gatherFatigue());
  got.forEach((g) => discoverItem(g.id));
  recordStat("gather", got.length);
  questProgress("gather", got.length);
  onProductionAction();

  floatLoot(got);
  const tierMsg = tier.name ? `[${tier.name}] ` : "";
  if (rareHit) {
    sfx.rare();
    say(`${tierMsg}우와! ${p.rare.pic}${p.rare.nm} 같은 귀한 걸 얻었어요!! 🎉`);
  } else {
    sfx.get();
    const first = got[0];
    say(`${tierMsg}${first.pic}${first.nm}${got.length > 1 ? " 외 " + (got.length - 1) + "개" : ""} 획득! (내공 +${gongGain})`);
  }

  checkRankUp();
  if (S.fatigue >= 100) say("헉헉... 완전 지쳤어요! 이제 집에서 쉬어야 해요~ 😵");
  renderHud(); renderInv(); renderScene(); renderPanel();
}


// ===== js/systems/battle.js =====
// 몬스터 전투 — 턴제 로직 (보스·강공격·방어구 포함)

// 계급이 오를수록 강한 몬스터가 등장
function pickFoe() {
  const maxIdx = Math.min(MONSTERS.length - 1, 1 + Math.floor(S.rankIdx * 0.8));
  return MONSTERS[rnd(maxIdx + 1)];
}

function startBattle(foe) {
  if (S.hp <= 0) { sfx.bad(); say("체력이 없어요! 🏠집에서 쉬고 와야 해요~"); return; }
  if (S.fatigue >= 100) { sfx.bad(); say("너무 지쳤어요! 싸우려면 먼저 쉬어야 해요~ 😵"); return; }
  S.foe = { ref: foe, hp: foe.hp, boss: !!foe.boss };
  say(`${foe.pic}${foe.nm}와(과)의 전투 시작! 공격 버튼을 눌러요! ⚔️`);
  renderScene(); renderPanel();
}

function startBoss() {
  const boss = availableBoss(S.rankIdx);
  if (!boss) { sfx.bad(); toast("아직 보스에 도전할 수 없어요!"); say("계급을 더 올리면 무시무시한 보스가 나타나요! 🔥"); return; }
  startBattle(boss);
  if (S.foe) say(`🔥 보스 ${boss.pic}${boss.nm} 등장!! 조심해요~ 강공격과 물약을 잘 써봐요!`);
}

// 몬스터 반격 (방어구로 피해 감소)
function foeCounter() {
  const f = S.foe;
  const pdmg = Math.max(1, f.ref.atk + rnd(5) - S.armor * 3);
  S.hp = Math.max(0, S.hp - pdmg); sfx.hurt(); shake("pHero");
  return pdmg;
}

function battleAttack() {
  if (!S.foe) return;
  const f = S.foe;
  const dmg = playerAtk() + rnd(6);
  f.hp -= dmg; sfx.hit(); shake("fHero");
  S.fatigue = Math.min(100, S.fatigue + 5);
  onProductionAction();

  if (f.hp <= 0) { winBattle(); return; }
  const pdmg = foeCounter();
  say(`🗡️ ${dmg} 피해! ${f.ref.pic}의 반격 💥 ${pdmg} 피해!`);
  if (S.hp <= 0) { loseBattle(); return; }
  renderHud(); renderScene(); renderPanel();
}

function strongAttack() {
  if (!S.foe) return;
  if (S.fatigue >= 100) { sfx.bad(); say("너무 지쳐서 강공격을 할 수 없어요! 😵"); return; }
  const f = S.foe;
  const dmg = playerAtk() * 2 + rnd(8);
  f.hp -= dmg; sfx.hit(); shake("fHero");
  S.fatigue = Math.min(100, S.fatigue + 12);
  onProductionAction();

  if (f.hp <= 0) { winBattle(); return; }
  const pdmg = foeCounter();
  say(`💥 강공격! ${dmg} 피해! ${f.ref.pic}의 반격 💢 ${pdmg} 피해!`);
  if (S.hp <= 0) { loseBattle(); return; }
  renderHud(); renderScene(); renderPanel();
}

function usePotion() {
  if (!S.foe) return;
  if (S.potions <= 0) { toast("물약이 없어요!"); return; }
  S.potions--;
  const before = S.hp;
  S.hp = Math.min(S.maxHp, S.hp + 35); sfx.heal();
  const realHeal = S.hp - before;
  const pdmg = foeCounter();
  say(`🧪 물약으로 체력 +${realHeal}! 하지만 ${S.foe.ref.pic}의 반격 💥 ${pdmg} 피해!`);
  if (S.hp <= 0) { loseBattle(); return; }
  renderHud(); renderScene(); renderPanel();
}

function fleeBattle() {
  S.foe = null; S.fatigue = Math.min(100, S.fatigue + 3);
  say("잽싸게 도망쳤어요! 전리품은 없지만 안전이 최고죠~ 🏃💨");
  renderHud(); renderScene(); renderPanel();
}

function winBattle() {
  const f = S.foe.ref;
  const boss = S.foe.boss;
  addItem(f.drop);
  S.money += f.gold;
  S.gong += f.gong;
  discoverMonster(f.id);
  recordStat("kills", 1);
  if (boss) recordStat("bossKills", 1);
  questProgress("kill", 1);
  S.fatigue = Math.min(100, S.fatigue + (boss ? 20 : 12));
  S.foe = null; sfx.up();
  if (boss) {
    showModal("🏆", `보스 ${f.nm} 격파!`, `대단해요!! 전리품 ${f.drop.pic}${f.drop.nm} + ${won(f.gold)} + 내공 ${f.gong} 획득! 🎉`);
  } else {
    say(`${f.pic}${f.nm} 처치! 전리품 ${f.drop.pic}${f.drop.nm} + ${won(f.gold)} + 내공 ${f.gong} 획득! 🎉`);
    toast(`승리! +${won(f.gold)} / 내공 +${f.gong}`);
  }
  checkRankUp();
  renderHud(); renderInv(); renderScene(); renderPanel(); renderNav();
}

function loseBattle() {
  const lost = Math.floor(S.money * 0.1);
  S.money -= lost; S.foe = null; S.hp = S.maxHp; S.place = "home"; S.mode = "world";
  sfx.bad();
  showModal("😵", "기절했어요...", `몬스터에게 졌어요! ${won(lost)}을 떨어뜨렸지만, 착한 이웃이 집으로 데려다줬어요. 체력은 회복됐으니 다시 도전! 💪`);
  renderHud(); renderScene(); renderPanel(); renderNav();
}

// 경제 — 판매 / 도구·무기 강화 / 물약 구매

// 시세가 적용된 개당 판매가
function unitPrice(it) { return sellPrice(it); }
function sellTotal() { return invSlots().reduce((s, x) => s + unitPrice(x) * x.count, 0); }

function sellOne(id) {
  const it = S.inv[id];
  if (!it || it.count <= 0) return;
  const gain = unitPrice(it) * it.count; S.money += gain;
  toast(`${it.pic}${it.nm} ×${it.count} → +${won(gain)}`);
  it.count = 0; sfx.sell();
  recordStat("sold", gain); questProgress("sell", gain);
  renderHud(); renderInv(); renderPanel();
  say(`${it.nm}을(를) 팔아서 ${won(gain)} 벌었어요! 💰`);
}

function sellAll() {
  const total = sellTotal();
  if (total <= 0) return;
  S.money += total;
  Object.values(S.inv).forEach((x) => (x.count = 0));
  sfx.sell(); toast(`전부 팔았어요! +${won(total)}`);
  recordStat("sold", total); questProgress("sell", total);
  say(`자원을 몽땅 팔아서 ${won(total)} 벌었어요! 부자 되는 중~ 🤑`);
  renderHud(); renderInv(); renderPanel();
}

function toolCost() { return 800 + (S.tool - 1) * 700; }
function buyTool() {
  const c = toolCost();
  if (S.money < c) { sfx.bad(); toast("돈이 부족해요!"); say("돈이 조금 모자라요~ 자원을 더 팔아봐요! 💸"); return; }
  S.money -= c; S.tool++; sfx.up();
  toast(`도구 강화! Lv.${S.tool}`);
  say(`도구를 강화했어요! 이제 한 번에 최대 ${1 + S.tool}개까지 얻어요! 💪`);

}

function weaponCost() { return 1000 + (S.weapon - 1) * 900; }
function buyWeapon() {

  if (S.money < c) { sfx.bad(); toast("돈이 부족해요!"); say("무기 살 돈이 모자라요~ 더 벌어봐요! 💸"); return; }

function armorCost() { return 900 + S.armor * 800; }

  if (S.money < c) { sfx.bad(); toast("돈이 부족해요!"); say("방어구 살 돈이 모자라요~ 더 벌어봐요! 💸"); return; }

function doSleep() {
  if (S.fatigue <= 0 && S.hp >= S.maxHp) { say("전혀 안 피곤한데요? 쌩쌩해요! 😆"); return; }
  const rec = S.bed ? 100 : 70;
  S.fatigue = Math.max(0, S.fatigue - rec);
  S.hp = S.bed ? S.maxHp : Math.min(S.maxHp, S.hp + Math.ceil(S.maxHp * 0.7));
  sfx.sleep();
  say(S.bed
    ? "푹신침대에서 쿨쿨~ 피로와 체력이 싹 회복됐어요! 😴✨"
    : "쿨쿨 잘 잤다~ 피로가 풀리고 체력도 많이 찼어요! 😴");
  renderHud(); renderScene(); renderPanel();
}

function buyBed() {

}


// ===== js/systems/home.js =====
// P2 집 콘텐츠 로직: 제작 / 요리 / 농사 + 활동 경과 처리

// ---- 인벤토리 재료 확인/차감 ----
function hasItems(needs) {
  return Object.entries(needs).every(([id, q]) => (S.inv[id] ? S.inv[id].count : 0) >= q);
}
function takeItems(needs) {
  Object.entries(needs).forEach(([id, q]) => { if (S.inv[id]) S.inv[id].count -= q; });
}
function needsText(needs) {
  return Object.entries(needs)
    .map(([id, q]) => `${itemDef(id).pic}${itemDef(id).nm}×${q}`)
    .join(" + ");
}

// ---- 매 활동(채집/전투)마다 호출: 요리 버프 경과 + 농작물 성장 ----
function onProductionAction() {
  if (S.foodBuff) {
    S.foodBuff.turns--;
    if (S.foodBuff.turns <= 0) S.foodBuff = null;
  }
  S.farm.forEach((p) => {
    const c = CROPS[p.cropId];
    if (c && p.progress < c.grow) p.progress++;
  });
}

// ---- 작업대(제작) ----
function craft(recipeId) {
  const r = CRAFT.find((x) => x.id === recipeId);
  if (!r) return;
  if (!r.makesItem && S.furniture.includes(r.id)) { toast("이미 가지고 있어요!"); return; }
  if (!hasItems(r.needs)) { sfx.bad(); toast("재료가 부족해요!"); say(`${r.nm} 만들 재료가 모자라요~ (${needsText(r.needs)}) 🔨`); return; }

  takeItems(r.needs);
  if (r.makesItem) {
    const def = itemDef(r.id);
    addItem(def);
    sfx.up(); toast(`${r.pic}${r.nm} 제작!`);
    say(`${r.pic}${r.nm}을(를) 만들었어요! 가구 재료로 써봐요~ 🪚`);
  } else {
    S.furniture.push(r.id);
    applyFurnitureEffect(r.effect);
    sfx.up();
    showModal(r.pic, `${r.nm} 완성!`, `${r.desc}. 집이 더 좋아졌어요! 🛋️`);
  }
  recordStat("craft", 1); discoverRecipe(r.id);
  renderHud(); renderInv(); renderPanel();
}

function applyFurnitureEffect(eff) {
  if (!eff) return;
  if (eff.maxHp) { S.maxHp += eff.maxHp; S.hp += eff.maxHp; }
  if (eff.fatigueReduce) S.mods.fatigueReduce += eff.fatigueReduce;
  if (eff.atkBonus) S.mods.atkBonus += eff.atkBonus;
  if (eff.gatherBonus) S.mods.gatherBonus += eff.gatherBonus;
  if (eff.gongBonus) S.mods.gongBonus += eff.gongBonus;
}

// ---- 부엌(요리) ----
function cook(recipeId) {
  const c = COOK.find((x) => x.id === recipeId);
  if (!c) return;
  if (!hasItems(c.needs)) { sfx.bad(); toast("재료가 부족해요!"); say(`${c.nm} 요리 재료가 모자라요~ (${needsText(c.needs)}) 🍳`); return; }

  takeItems(c.needs);
  sfx.heal();
  if (c.kind === "instant") {
    if (c.hp) S.hp = Math.min(S.maxHp, S.hp + c.hp);
    if (c.fatigue) S.fatigue = Math.max(0, S.fatigue + c.fatigue);
    say(`${c.pic}${c.nm} 냠냠~ ${c.desc}! 맛있어요! 😋`);
  } else {
    S.foodBuff = { id: c.id, nm: c.nm, pic: c.pic, stat: c.stat, amount: c.amount, turns: c.turns };
    say(`${c.pic}${c.nm}을(를) 먹었어요! ${c.desc} 💪`);
  }
  recordStat("cook", 1); questProgress("cook", 1);
  renderHud(); renderInv(); renderPanel();
}

// ---- 농지(농사) ----
function plant(cropId) {
  const c = CROPS[cropId];
  if (!c) return;
  if (S.farm.length >= MAX_PLOTS) { sfx.bad(); toast("밭이 가득 찼어요!"); return; }
  if (S.money < c.seedCost) { sfx.bad(); toast("씨앗 살 돈이 부족해요!"); return; }
  S.money -= c.seedCost;
  S.farm.push({ cropId, progress: 0 });
  sfx.get(); toast(`${c.pic}${c.nm} 씨앗을 심었어요!`);
  say(`${c.pic}${c.nm} 씨앗을 심었어요! 활동하며 기다리면 자라나요~ 🌱`);
  renderHud(); renderPanel();
}

function harvest(index) {
  const p = S.farm[index];
  if (!p) return;
  const c = CROPS[p.cropId];
  if (p.progress < c.grow) { toast("아직 덜 자랐어요!"); return; }
  let msg = [];
  c.yield.forEach((y) => { for (let i = 0; i < y.qty; i++) addItem(y); msg.push(`${y.pic}${y.nm}×${y.qty}`); });
  S.farm.splice(index, 1);
  sfx.up(); toast(`수확! ${msg.join(", ")}`);
  recordStat("harvest", 1); questProgress("harvest", 1);
  say(`${c.pic}${c.nm}을(를) 수확했어요! ${msg.join(", ")} 획득! 🧺`);
  renderHud(); renderInv(); renderPanel();
}


// ===== js/systems/meta.js =====
// P4 메타 로직: 일일 퀘스트 / 도감 / 업적 / 별머니 상점 / 상점 시세

function today() { return new Date().toISOString().slice(0, 10); }

// 날짜가 바뀌면 퀘스트·시세 갱신
function ensureDaily() {
  const d = today();
  if (S.quests.date !== d) S.quests = generateDailyQuests(d);
  if (S.market.date !== d) S.market = generateMarket(d, Object.keys(ITEM_INDEX));
}

// ---- 진행/기록 훅 ----
function recordStat(key, n = 1) { S.stats[key] = (S.stats[key] || 0) + n; }

function questProgress(type, amount) {
  let any = false;
  S.quests.list.forEach((q) => {
    if (q.type === type && !q.done) {
      q.progress += amount;
      if (q.progress >= q.goal) { q.progress = q.goal; q.done = true; any = true; }
    }
  });
  if (any) { sfx.get(); toast("퀘스트 완료! 📜 수첩에서 보상을 받아요!"); }
}

function discoverItem(id) { if (id && !S.codex.items.includes(id)) S.codex.items.push(id); }
function discoverMonster(id) { if (id && !S.codex.monsters.includes(id)) S.codex.monsters.push(id); }
function discoverRecipe(id) { if (id && !S.codex.recipes.includes(id)) S.codex.recipes.push(id); }

// ---- 퀘스트 보상 수령 ----
function claimQuest(index) {
  const q = S.quests.list[index];
  if (!q || !q.done || q.claimed) return;
  S.money += q.rewardMoney;
  q.claimed = true;
  sfx.up();
  toast(`보상 획득! +${q.rewardMoney.toLocaleString("ko-KR")}별`);
  say(`퀘스트 보상을 받았어요! 내일 또 새로운 퀘스트가 와요~ 📜`);
  renderHud(); renderPanel();
}

// ---- 특수아이템샵 (별머니로 고가 사기템 구매) ----
function buyStar(id) {
  const item = STAR_SHOP.find((x) => x.id === id);
  if (!item) return;
  if (S.money < item.cost) { sfx.bad(); toast("별머니가 부족해요!"); say("최고급 사기템은 엄청 비싸요~ 자원을 팔고 보스를 잡아 모아봐요! ⭐"); return; }
  S.money -= item.cost;
  item.apply(S);
  sfx.up();
  toast(`${item.pic}${item.nm} 구매!`);
  say(`${item.pic}${item.nm}을(를) 샀어요! ${item.desc} ✨`);
  renderHud(); renderPanel();
}

// ---- 업적 상태 ----
function achievementsStatus() {
  return ACHIEVEMENTS.map((a) => ({ ...a, done: !!a.check(S.stats, S) }));
}

// ---- 상점 시세 적용 판매가 ----
function sellPrice(item) {
  const mult = S.market.mult || 1;
  const hot = S.market.hotItem === item.id ? 1.3 : 1;
  return Math.max(1, Math.round(item.pr * mult * hot));
}

  },

  },

    exits: [{ dir: "S", to: "village", label: "마을" }],
  },
};

const char = { x: 300, y: 344, bob: 0 };
const held = new Set();
let target = null, active = null;
let canvas = null, ctx = null, raf = null, keysBound = false;

function map() { return MAPS[S.mapId] || MAPS.village; }
function blocked() {
  return ["popup", "ov", "tutOv", "mgOv"].some((id) => { const e = document.getElementById(id); return e && e.classList.contains("show"); });
}
function locked(o) {
  if (o.minReq != null && S.rankIdx < o.minReq) return "rank";
  if (o.heaven && !S.heavenOpen) return "heaven";
  return null;
}

function bindKeys() {
  if (keysBound) return; keysBound = true;
  preloadSprites();
  const m = { ArrowUp: "up", ArrowDown: "down", ArrowLeft: "left", ArrowRight: "right", w: "up", s: "down", a: "left", d: "right", W: "up", S: "down", A: "left", D: "right" };
  window.addEventListener("keydown", (e) => { if (S.mode !== "world" || blocked()) return; const d = m[e.key]; if (d) { held.add(d); target = null; e.preventDefault(); } });
  window.addEventListener("keyup", (e) => { const d = m[e.key]; if (d) held.delete(d); });
}

function ensureMounted(sc) {
  bindKeys();
  if (canvas && sc.contains(canvas)) { start(); return; }
  sc.innerHTML = "";
  canvas = document.createElement("canvas");
  canvas.width = W; canvas.height = H; canvas.className = "world";
  canvas.setAttribute("aria-label", "게임 월드 지도. 방향키/WASD/마우스로 이동, Space로 상호작용, 길 끝으로 가면 다음 맵");
  sc.appendChild(canvas);
  ctx = canvas.getContext("2d");
  canvas.addEventListener("pointerdown", onTap);
  sc.appendChild(buildDpad());
  start();
}
function unmount() { stop(); canvas = null; ctx = null; }
function start() { if (!raf) raf = requestAnimationFrame(loop); }
function stop() { if (raf) { cancelAnimationFrame(raf); raf = null; } }

function onTap(e) {
  const r = canvas.getBoundingClientRect();
  target = {
    x: Math.max(EDGE, Math.min(W - EDGE, (e.clientX - r.left) * (W / r.width))),
    y: Math.max(EDGE, Math.min(H - 16, (e.clientY - r.top) * (H / r.height))),
  };
  held.clear();
}

function loop() {
  raf = null;
  if (!canvas || S.mode !== "world") return;
  update(); draw();
  raf = requestAnimationFrame(loop);
}

function update() {
  let dx = 0, dy = 0;
  if (held.size) {
    if (held.has("up")) dy -= 1; if (held.has("down")) dy += 1;
    if (held.has("left")) dx -= 1; if (held.has("right")) dx += 1;
  } else if (target) {
    const tx = target.x - char.x, ty = target.y - char.y, dist = Math.hypot(tx, ty);
    if (dist < SPEED) { char.x = target.x; char.y = target.y; target = null; }
    else { dx = tx / dist; dy = ty / dist; }
  }
  if (dx || dy) {
    const len = Math.hypot(dx, dy) || 1;
    char.x = Math.max(10, Math.min(W - 10, char.x + (dx / len) * SPEED));
    char.y = Math.max(10, Math.min(H - 10, char.y + (dy / len) * SPEED));
    char.bob += 0.3;
  }
  for (const ex of map().exits) {
    if (ex.dir === "W" && char.x <= EDGE && Math.abs(char.y - H / 2) < ALIGN) return changeMap(ex, "W");
    if (ex.dir === "E" && char.x >= W - EDGE && Math.abs(char.y - H / 2) < ALIGN) return changeMap(ex, "E");
    if (ex.dir === "N" && char.y <= EDGE && Math.abs(char.x - W / 2) < ALIGN) return changeMap(ex, "N");
    if (ex.dir === "S" && char.y >= H - EDGE && Math.abs(char.x - W / 2) < ALIGN) return changeMap(ex, "S");
  }
  active = null; let best = REACH;
  for (const o of map().objects) {
    const d = Math.hypot(o.x - char.x, o.y - char.y);
    if (d < best) { best = d; active = o; }
  }
}

function changeMap(ex, dir) {
  S.mapId = ex.to; held.clear(); target = null; active = null;
  if (dir === "W") { char.x = W - 44; char.y = H / 2; }
  else if (dir === "E") { char.x = 44; char.y = H / 2; }
  else if (dir === "N") { char.x = W / 2; char.y = H - 44; }
  else { char.x = W / 2; char.y = 44; }
  sfx.get();
  say(`${map().name}에 도착! 표지판을 보고 이동해봐요~`);
}

// ---- 그리기 ----
function roundRect(x, y, w, h, r) {
  ctx.beginPath(); ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}
function drawSprite(name, x, y, size) {
  const img = getSprite(name);
  if (img && img.complete && img.naturalWidth) ctx.drawImage(img, x - size / 2, y - size / 2, size, size);
}

function draw() {
  const M = map();
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, M.ground[0]); g.addColorStop(1, M.ground[1]);
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  // 잔디 점무늬
  ctx.fillStyle = "rgba(255,255,255,.10)";
  for (let i = 0; i < 60; i++) ctx.fillRect((i * 97) % W, (i * 53) % H, 3, 3);

  // 길
  const RW = 46;
  for (const ex of M.exits) {
    ctx.fillStyle = "#d8c48c";
    if (ex.dir === "N") ctx.fillRect(W / 2 - RW / 2, 0, RW, H / 2);
    if (ex.dir === "S") ctx.fillRect(W / 2 - RW / 2, H / 2, RW, H / 2);
    if (ex.dir === "W") ctx.fillRect(0, H / 2 - RW / 2, W / 2, RW);
    if (ex.dir === "E") ctx.fillRect(W / 2, H / 2 - RW / 2, W / 2, RW);
  }
  // 길 가운데 점선
  ctx.strokeStyle = "rgba(255,255,255,.5)"; ctx.lineWidth = 3; ctx.setLineDash([10, 10]);
  for (const ex of M.exits) {
    ctx.beginPath();
    if (ex.dir === "N") { ctx.moveTo(W / 2, 0); ctx.lineTo(W / 2, H / 2); }
    if (ex.dir === "S") { ctx.moveTo(W / 2, H); ctx.lineTo(W / 2, H / 2); }
    if (ex.dir === "W") { ctx.moveTo(0, H / 2); ctx.lineTo(W / 2, H / 2); }
    if (ex.dir === "E") { ctx.moveTo(W, H / 2); ctx.lineTo(W / 2, H / 2); }
    ctx.stroke();
  }
  ctx.setLineDash([]);

  // 표지판
  ctx.textAlign = "center"; ctx.textBaseline = "middle";
  for (const ex of M.exits) drawSign(ex);

  // 오브젝트 (뒤→앞 y정렬)
  const objs = [...M.objects].sort((a, b) => a.y - b.y);
  for (const o of objs) {
    const lk = locked(o);
    ctx.globalAlpha = lk ? 0.55 : 1;
    drawSprite(ART[o.place], o.x, o.y - 6, o.kind === "build" ? 84 : 76);
    ctx.globalAlpha = 1;
    // 라벨 칩
    ctx.font = "bold 13px Jua, sans-serif";
    const t = (lk ? "🔒" : "") + o.label, w = ctx.measureText(t).width + 14;
    ctx.fillStyle = "rgba(255,255,255,.85)"; roundRect(o.x - w / 2, o.y + 26, w, 18, 9); ctx.fill();
    ctx.fillStyle = "#2e2620"; ctx.fillText(t, o.x, o.y + 35);
  }

  // 프롬프트
  if (active) {
    ctx.strokeStyle = "#ffcf33"; ctx.lineWidth = 4;
    ctx.beginPath(); ctx.arc(active.x, active.y - 6, 40, 0, Math.PI * 2); ctx.stroke();
    const msg = locked(active) ? "🔒 잠김" : "Space / Ⓐ";
    ctx.font = "bold 12px Jua, sans-serif";
    const w = ctx.measureText(msg).width + 14;
    ctx.fillStyle = "#2e2620"; roundRect(active.x - w / 2, active.y - 62, w, 19, 9); ctx.fill();
    ctx.fillStyle = "#fff"; ctx.fillText(msg, active.x, active.y - 52);
  }

  // 캐릭터
  drawSprite("char", char.x, char.y - 10 + Math.sin(char.bob) * 2, 52);
}

function drawSign(ex) {
  const arrow = { N: "⬆", S: "⬇", W: "⬅", E: "➡" }[ex.dir];
  let x, y;
  if (ex.dir === "N") { x = W / 2 + 60; y = 46; }
  else if (ex.dir === "S") { x = W / 2 + 60; y = H - 46; }
  else if (ex.dir === "W") { x = 60; y = H / 2 - 42; }
  else { x = W - 60; y = H / 2 - 42; }
  const text = `${arrow} ${ex.label}`;
  ctx.font = "bold 13px Jua, sans-serif";
  const w = ctx.measureText(text).width + 18;
  ctx.fillStyle = "#7b4a2a"; ctx.fillRect(x - 3, y, 6, 30);
  ctx.fillStyle = "#fff6e0"; ctx.strokeStyle = "#7b4a2a"; ctx.lineWidth = 2.5;
  roundRect(x - w / 2, y - 20, w, 22, 7); ctx.fill(); ctx.stroke();
  ctx.fillStyle = "#3a2b1f"; ctx.fillText(text, x, y - 9);
}

// ---- 상호작용 ----
function interact() { if (S.mode === "world" && active) doInteract(active); }
function doInteract(o) {
  const lk = locked(o);
  if (lk === "rank") { sfx.bad(); toast("상인 계급부터 갈 수 있어요!"); return; }
  if (lk === "heaven") { sfx.bad(); toast(`선행 ${HEAVEN_DEED}점을 모아야 열려요! (지금 ${S.deed}점)`); return; }
  if (o.kind === "gather") { S.place = o.place; renderNav(); say(`${PLACES[o.place].name}에서 ${PLACES[o.place].verb}!`); doWork(); }
  else if (o.kind === "dungeon") { enterDungeon(); }
  else if (o.kind === "portal") { changeToMap(o.to); }
  else { openBuilding(o.place); }
}

function openBuilding(place) {
  S.place = place;
  openPopup(place);   // 인게임 팝업 열기
  const names = { shop: "🏪 상점", home: "🏠 우리 집", donate: "❤️ 기부소", journal: "📋 모험수첩" };
  say(`${names[place] || place}에 들어왔어요!`);
}

function changeToMap(mid, atPlace) {
  S.mapId = mid; held.clear(); target = null;
  const o = atPlace ? MAPS[mid].objects.find((x) => x.place === atPlace) : null;
  if (o) { char.x = o.x; char.y = Math.min(H - 16, o.y + 46); active = o; }
  else { char.x = W / 2; char.y = H - 44; active = null; }
}

function enterDungeon() {
  S.mode = "battle"; S.place = "battle"; S.foe = null;
  renderScene(); renderPanel(); renderNav();
  say("던전에 들어왔어요! 몬스터와 싸우거나 나가기로 돌아가요 ⚔️");
}
function exitDungeon() {
  S.mode = "world"; S.mapId = "dungeon"; S.foe = null;
  renderScene(); renderPanel(); renderNav();
  say("던전 입구로 나왔어요. 동쪽 길로 가면 숲이에요~ 🌲");
}

function goTo(key) {
  for (const mid in MAPS) {
    const o = MAPS[mid].objects.find((x) => x.place === key);
    if (o) {
      if (S.mode !== "world") { S.mode = "world"; renderScene(); }
      changeToMap(mid, key);
      doInteract(o);
      return;
    }
  }
}

function buildDpad() {
  const wrap = document.createElement("div");
  wrap.className = "dpad";
  const mk = (cls, txt, dir) => {
    const b = document.createElement("button");
    b.className = "dbtn " + cls; b.textContent = txt; b.setAttribute("aria-label", cls);
    if (dir) {
      const on = (e) => { e.preventDefault(); held.add(dir); target = null; };
      const off = (e) => { e.preventDefault(); held.delete(dir); };
      b.addEventListener("pointerdown", on); b.addEventListener("pointerup", off);
      b.addEventListener("pointerleave", off); b.addEventListener("pointercancel", off);
    } else b.addEventListener("click", (e) => { e.preventDefault(); interact(); });
    return b;
  };
  wrap.appendChild(mk("up", "▲", "up")); wrap.appendChild(mk("left", "◀", "left"));
  wrap.appendChild(mk("act", "Ⓐ", null)); wrap.appendChild(mk("right", "▶", "right"));
  wrap.appendChild(mk("down", "▼", "down"));
  return wrap;
}


// ===== js/ui/render.js =====
// 렌더러: 인게임 HUD / 월드·전투 화면 / 팝업(가방·상점·집·수첩·설명서·설정)


const GATHERABLE_IDS = (() => {
  const set = new Set();
  Object.values(PLACES).forEach((p) => { (p.loot || []).forEach((x) => set.add(x.id)); if (p.rare) set.add(p.rare.id); });
  return [...set];
})();
const DYNAMIC_POPS = new Set(["shop", "home", "donate", "journal", "bag", "travel"]);

// ---------- HUD ----------
function renderHud() {
  $("rankName").textContent = rankName();
  const nr = nextRank();
  if (nr) {
    const base = RANKS[S.rankIdx].g, span = nr.g - base;
    $("gongBar").style.width = Math.max(0, Math.min(100, ((S.gong - base) / span) * 100)) + "%";
    $("rankChip").title = `다음: ${nr.n} (${S.gong}/${nr.g})`;
  } else { $("gongBar").style.width = "100%"; $("rankChip").title = "최고 계급!"; }

  $("money").textContent = won(S.money);

}

// ---------- 인벤토리(가방) ----------
function renderInv() {
  const slots = invSlots();

function renderScene() {

  else { battle.classList.remove("show"); world.ensureMounted($("scene")); }

function hpBar(cur, max, color) {
  const p = Math.max(0, Math.min(100, (cur / max) * 100));
  return `<div style="width:130px;height:9px;border-radius:6px;background:#0004;margin:4px auto"><i style="display:block;height:100%;width:${p}%;border-radius:6px;background:${color}"></i></div>`;
}

function renderBattle() {
  const box = $("battleBox");
  if (!S.foe) {
    const foe = pickFoe();
    const boss = availableBoss(S.rankIdx);
    box.innerHTML = `
      <div class="bfield"><div class="who"><div class="em">${foe.pic}</div><div>야생의 ${foe.nm}</div>
        <div style="font-size:12px;opacity:.8">체력 ${foe.hp}·공격 ${foe.atk}·보상 ${won(foe.gold)}</div></div></div>

        <div style="align-self:center;font-size:22px">⚔️</div>
        <div class="who"><div class="em">${f.ref.pic}</div><div>${f.ref.nm}</div>${hpBar(f.hp, f.ref.hp, "#eb3b5a")}<div style="font-size:12px">💀 ${Math.max(0, f.hp)}/${f.ref.hp}</div></div>
      </div>
      <div class="act" id="act"></div>`;

    const pot = mkbtn("btn sleep", `🧪 물약(${S.potions})`, usePotion); if (S.potions <= 0) pot.disabled = true; act.appendChild(pot);
    act.appendChild(mkbtn("btn give", "🏃 도망", fleeBattle));
  }
}

function mkbtn(cls, text, on) { const b = document.createElement("button"); b.className = cls; b.textContent = text; b.onclick = on; return b; }

// ---------- 팝업 시스템 ----------
function openPopup(kind) { S.popup = kind; buildPopup(kind); $("popup").classList.add("show"); }
function closePopup() { S.popup = null; $("popup").classList.remove("show"); }
function refreshPopup() { if (S.popup) buildPopup(S.popup); }
// 시스템들이 호출하는 renderPanel = 현재 열린 팝업 갱신
function renderPanel() { if (S.popup && DYNAMIC_POPS.has(S.popup)) refreshPopup(); }
// 내비 제거됨 → no-op (하위 호환)
function renderNav() {}

function buildPopup(kind) {
  const pan = $("popBody");

// ---------- 가방 ----------

// ---------- 상점 ----------
function renderShop(pan) {
  const slots = invSlots();
  const m = S.market || { mult: 1, hotItem: null };
  const trend = m.mult > 1.05 ? "📈 호황!" : m.mult < 0.95 ? "📉 불황…" : "➖ 보통";
  const hot = m.hotItem && itemDef(m.hotItem);
  let h = `<h2>🏪 상점</h2>`;
  h += `<div class="muted" style="margin-bottom:8px">오늘의 시세 <b>×${m.mult}</b> ${trend}${hot ? ` · 인기 <b>${hot.pic}${hot.nm}</b>(+30%)` : ""}</div>`;
  if (!slots.length) h += `<div class="muted">팔 자원이 없어요~ 먼저 자원을 모아오세요!</div>`;
  else {
    h += `<button class="btn sell" id="sellAll" style="width:100%;margin-bottom:8px">💰 전부 팔기 (${won(sellTotal())})</button>`;

      h += `<div class="row"><span style="flex:1">${c.pic}${c.nm} ${ready ? "🌟 다 자람!" : `<span class="muted">(${p.progress}/${c.grow})</span>`}<div style="height:8px;margin-top:4px;width:130px;background:#eee;border-radius:6px"><i style="display:block;height:100%;width:${pct}%;background:var(--green);border-radius:6px"></i></div></span><button data-harvest="${i}" ${ready ? "" : "disabled"} style="background:${ready ? "var(--green)" : "#ccc"}">수확</button></div>`; });
    h += `<h3>🌱 씨앗 심기</h3>` + Object.values(CROPS).map((c) => `<div class="row"><span>${c.pic}${c.nm} <span class="muted">· ${c.grow}회 → ${c.yield.map((y) => y.pic + y.nm + "×" + y.qty).join(",")}</span></span><button data-plant="${c.id}" style="background:var(--green)">${won(c.seedCost)}</button></div>`).join("");
    return h;
  }
  if (tab === "deco") {
    const score = S.furniture.reduce((s, id) => { const r = CRAFT.find((x) => x.id === id); return s + (r ? r.deco || 0 : 0); }, 0);

    return h;

function craftRow(r) {

  { em: "🏪", title: "③ 상점에 팔아요", text: "모은 자원은 상점에서 팔아 별머니로! 그 돈으로 도구·무기를 강화하면 더 강해져요. (게임의 유일한 통화는 별머니예요)" },
  { em: "😴", title: "④ 집에서 쉬어요", text: "활동하면 피로도가 쌓이고 체력이 닳아요. 피로도가 가득 차기 전에 집에서 잠을 자 회복하세요!" },
  { em: "❤️", title: "⑤ 선행을 쌓아요", text: "기부소에서 돈을 기부하면 선행점수가 올라요. 50점을 모으면 하늘나라가 열려요! 자, 시작해볼까요?" },
];

function maybeTutorial() {
  if (S.flags && S.flags.tutorialDone) return;
  open(0);
}

function finish() {
  const ov = document.getElementById("tutOv");
  if (ov) ov.remove();
  S.flags = S.flags || {};
  S.flags.tutorialDone = true;
  save();
}

function open(idx) {
  let ov = document.getElementById("tutOv");
  if (!ov) {
    ov = document.createElement("div");
    ov.id = "tutOv";
    ov.className = "ov show";
    document.getElementById("frame").appendChild(ov);
  }
  const s = STEPS[idx];
  const last = idx === STEPS.length - 1;
  ov.innerHTML = `
    <div class="modal">
      <div class="em">${s.em}</div>
      <h2>${s.title}</h2>
      <p>${s.text}</p>
      <div style="display:flex;gap:8px;justify-content:center">
        <button class="btn sleep" id="tutSkip" style="box-shadow:0 5px 0 rgba(0,0,0,.18);flex:0 0 auto">건너뛰기</button>
        <button class="btn work" id="tutNext" style="box-shadow:0 5px 0 rgba(0,0,0,.18);flex:1">${last ? "시작하기! 🚀" : "다음 ▶"} (${idx + 1}/${STEPS.length})</button>
      </div>
    </div>`;
  document.getElementById("tutSkip").onclick = finish;
  document.getElementById("tutNext").onclick = () => { if (last) finish(); else open(idx + 1); };
}


// ===== js/main.js =====
// 엔트리: 저장 불러오기 → 렌더 → 튜토리얼. 액션바·팝업·키보드 조작 연결.

const KEYMAP = {
  "1": "forest", "2": "sea", "3": "river", "4": "mine", "5": "field",
  "6": "battle", "7": "shop", "8": "home", "9": "journal", "0": "donate",
  "y": "dump", "p": "pirate", "v": "heaven",
};

function shown(id) { const e = $(id); return e && e.classList.contains("show"); }

function handleKey(e) {
  const t = e.target;
  if (t && (t.tagName === "INPUT" || t.tagName === "TEXTAREA" || t.isContentEditable)) return;
  const k = e.key;

  // 미니게임
  if (shown("mgOv")) { if (k === " " || k === "Enter") { e.preventDefault(); $("mgHit") && $("mgHit").click(); } return; }
  // 튜토리얼
  const tut = $("tutOv");
  if (tut && tut.classList.contains("show")) {
    if (k === "Enter" || k === " ") { e.preventDefault(); $("tutNext") && $("tutNext").click(); }
    else if (k === "Escape") { $("tutSkip") && $("tutSkip").click(); }
    return;
  }
  // 이벤트 모달
  if (shown("ov")) { if (k === " " || k === "Enter" || k === "Escape") { e.preventDefault(); $("ovBtn") && $("ovBtn").click(); } return; }
  // 팝업 열림 → Esc로 닫기, 그 외 키는 무시(뒤에서 이동 방지)
  if (shown("popup")) { if (k === "Escape") { e.preventDefault(); closePopup(); } return; }

  if (k === "?") { e.preventDefault(); openPopup("manual"); return; }
  if (k === "i" || k === "I") { e.preventDefault(); openPopup("bag"); return; }

  // 주요 행동
  if (k === " " || k === "Enter") {
    e.preventDefault();
    if (S.mode === "world") world.interact();
    else { const b = document.querySelector("#act .btn.work"); if (b && !b.disabled) b.click(); }
    return;
  }
  // 빠른 이동
  const place = KEYMAP[k.toLowerCase()];
  if (place) { e.preventDefault(); go(place); }
}

function applyBgm() { if (S.settings.bgm && S.settings.sound) startBgm(); else stopBgm(); }

function init() {
  load();
  setMuted(!S.settings.sound);
  ensureDaily();
  renderAll();

  $("ovBtn").onclick = hideModal;
  $("popClose").onclick = closePopup;
  $("popup").addEventListener("click", (e) => { if (e.target.id === "popup") closePopup(); });

  $("bagBtn").onclick = () => openPopup("bag");
  $("travelBtn").onclick = () => openPopup("travel");
  $("manualBtn").onclick = () => openPopup("manual");
  $("gearBtn").onclick = () => openPopup("settings");

  document.addEventListener("keydown", handleKey);
  window.addEventListener("pointerdown", applyBgm, { once: true });

  startAutosave();
  maybeTutorial();
}

if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", init);
else init();

// ===== world 네임스페이스 shim =====
var world = { ensureMounted, unmount, interact, goTo, enterDungeon, exitDungeon };

})();
</script>
